identity:
  name: google_maps
  author: glorycloud
  label:
    en_US: Google Maps Search
    zh_Hans: 地图搜索
description:
  human:
    en_US: Search Google Maps for places and business information with GloryCloud. Find locations and organize business search results. New users receive $1 in signup credit, redeemable for 1,000 free queries.
    zh_Hans: 搜索 Google 地图中的地点与商家信息。
  llm: Search Google Maps for places and businesses. Returns the complete response including data.requestId and
    data.result. Do not automatically retry timeouts; a search may still complete and be billed.
parameters:
- name: query
  type: string
  required: true
  label:
    en_US: Search keywords
    zh_Hans: 搜索关键词
  human_description:
    en_US: Place or business keywords; at most 2048 UTF-8 bytes.
    zh_Hans: 输入地名或商家关键词，不超过 2048 字节。
  llm_description: Place or business keywords; at most 2048 UTF-8 bytes.
  form: llm
- name: language
  type: string
  required: false
  label:
    en_US: Interface language
    zh_Hans: 界面语言
  human_description:
    en_US: Optional language code such as en or zh-CN. Empty uses service defaults.
    zh_Hans: 可选，例如 en、zh-CN；留空使用服务默认值。
  llm_description: Optional language code such as en or zh-CN. Empty uses service defaults.
  form: form
- name: maxResults
  type: number
  required: false
  label:
    en_US: Maximum results
    zh_Hans: 结果数上限
  human_description:
    en_US: 'Optional: 1–40; 0 or empty means no additional truncation. This limits results, not the number of search
      calls.'
    zh_Hans: 可选：1–40；0 或留空表示不额外截断，不改变本次搜索的调用次数。
  llm_description: 'Optional: 1–40; 0 or empty means no additional truncation. This limits results, not the number
    of search calls.'
  form: llm
  min: 0
  max: 40
  precision: 0
- name: format
  type: select
  required: false
  label:
    en_US: Result format
    zh_Hans: 结果格式
  human_description:
    en_US: Return structured JSON, raw HTML, or both.
    zh_Hans: 返回结构化结果、原始网页或两者。
  llm_description: Return structured JSON, raw HTML, or both.
  form: form
  default: json
  options:
  - value: json
    label:
      en_US: JSON
      zh_Hans: 结构化结果（JSON）
  - value: html
    label:
      en_US: HTML
      zh_Hans: 原始网页（HTML）
  - value: json+html
    label:
      en_US: JSON + HTML
      zh_Hans: 结构化结果 + 原始网页
- name: country
  type: string
  required: false
  label:
    en_US: Country code
    zh_Hans: 国家代码
  human_description:
    en_US: Two-letter country code such as us.
    zh_Hans: 两位国家代码，例如 us。
  llm_description: Two-letter country code such as us.
  form: form
- name: latitude
  type: number
  required: false
  label:
    en_US: Latitude
    zh_Hans: 纬度
  human_description:
    en_US: -90 to 90; provide together with longitude. Leave both empty to use the service default center in New
      Jersey, USA.
    zh_Hans: -90 至 90，须与经度一起填写；两者均留空使用服务默认中心点（美国新泽西）。
  llm_description: -90 to 90; provide together with longitude. Leave both empty to use the service default center
    in New Jersey, USA.
  form: form
  min: -90
  max: 90
- name: longitude
  type: number
  required: false
  label:
    en_US: Longitude
    zh_Hans: 经度
  human_description:
    en_US: -180 to 180; provide together with latitude.
    zh_Hans: -180 至 180，须与纬度一起填写。
  llm_description: -180 to 180; provide together with latitude.
  form: form
  min: -180
  max: 180
- name: zoomLevel
  type: number
  required: false
  label:
    en_US: Zoom level
    zh_Hans: 缩放级别
  human_description:
    en_US: Integer 0–21; empty uses 14.
    zh_Hans: 0–21 的整数，留空使用 14。
  llm_description: Integer 0–21; empty uses 14.
  form: form
  min: 0
  max: 21
  precision: 0
- name: fetchLimit
  type: number
  required: false
  label:
    en_US: Places to fetch
    zh_Hans: 抓取地点数
  human_description:
    en_US: Integer 1–40; empty uses 10. maxResults can further limit the returned places.
    zh_Hans: 1–40 的整数，留空使用 10；结果数上限还会进一步截断地点列表。
  llm_description: Integer 1–40; empty uses 10. maxResults can further limit the returned places.
  form: form
  min: 1
  max: 40
  precision: 0
- name: minRating
  type: number
  required: false
  label:
    en_US: Minimum rating
    zh_Hans: 最低评分
  human_description:
    en_US: Number 0–5; empty means no minimum.
    zh_Hans: 0–5，留空表示不限制最低评分。
  llm_description: Number 0–5; empty means no minimum.
  form: form
  min: 0
  max: 5
- name: openNow
  type: boolean
  required: false
  label:
    en_US: Open now
    zh_Hans: 仅营业中
  human_description:
    en_US: Return businesses that are currently open. Disabled by default.
    zh_Hans: 仅返回当前营业中的商家，默认关闭。
  llm_description: Return businesses that are currently open. Disabled by default.
  form: form
  default: false
- name: includeDetails
  type: boolean
  required: false
  label:
    en_US: Include place details
    zh_Hans: 抓取商家详情
  human_description:
    en_US: Include available business details; enabled by default and may take longer. Reviews are not fetched.
    zh_Hans: 抓取可用的商家详情，默认开启，耗时可能更长；不抓取评论。
  llm_description: Include available business details; enabled by default and may take longer. Reviews are not fetched.
  form: form
  default: true
- name: pageToken
  type: string
  required: false
  label:
    en_US: Next page token
    zh_Hans: 下一页标识
  human_description:
    en_US: Copy nextPageToken from the preceding result. Empty means the first page.
    zh_Hans: 填入上次结果中的 nextPageToken；留空从首页开始。
  llm_description: Copy nextPageToken from the preceding result. Empty means the first page.
  form: form
extra:
  python:
    source: tools/google_maps.py
